spring.application.name=back-end-project

# JPA
spring.datasource.url=jdbc:mysql://localhost:3306/aws-project-01?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=Master@123
spring.main.banner-mode=off
spring.jpa.hibernate.ddl-auto=update

# Observability
spring.jpa.properties.hibernate.show_sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.orm.jdbc.bind=trace

aws.region=sa-east-1

# SNS
aws.sns.topic.product.events.arn=arn:aws:sns:sa-east-1:000000000000:product-events
aws.sns.endpoint=http://localhost:4566